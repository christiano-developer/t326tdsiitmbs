# Docs site for this repo (GitHub Pages, built by .github/workflows/pages.yml).
# Preview: python3 scripts/docs-assignments.py && uvx --from 'mkdocs<2' --with mkdocs-material mkdocs serve
site_name: t326tdsiitmbs
site_description: A reproducible workflow for solving Tools in Data Science (IITM BS) assignments.
site_url: https://christiano-developer.github.io/t326tdsiitmbs/
repo_url: https://github.com/christiano-developer/t326tdsiitmbs
repo_name: christiano-developer/t326tdsiitmbs
edit_uri: edit/main/docs/

# Footer contact. Set at build time from the EXAM_EMAIL repo variable so the email is never committed.
copyright: !ENV [SITE_FOOTER, "Built with MkDocs Material"]

theme:
  name: material
  font:
    text: Source Serif 4
    code: IBM Plex Mono
  icon:
    logo: material/newspaper-variant-outline
    repo: fontawesome/brands/github
  palette:            # single theme; colours live in docs/stylesheets/newspaper.css
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

extra_css:
  - stylesheets/newspaper.css

extra_javascript:
  - javascripts/newspaper.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Front page: index.md
  - Guide:
      - Getting started: getting-started.md
      - Per-question workflow: workflow.md
      - Branches, commits, tags: git.md
  - Assignments: assignments.md   # generated by scripts/docs-assignments.py
  - Reference: reference.md
